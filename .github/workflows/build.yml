name: Build Media3 FFmpeg Extension AAR (WMA/APE/AIFF + Container Demuxer)

# 瑙﹀彂鏂瑰紡锛?
# 1. 涓婁紶鏂囦欢鍒?main 鍒嗘敮鍚庤嚜鍔ㄥ紑濮?
# 2. 涔熷彲浠ュ湪 Actions 椤甸潰鎵嬪姩鐐瑰嚮 Run workflow
#
# 猸愶笍 鏈鏋勫缓鐩告瘮 v10 鏂板锛?
#   - 绉婚櫎 build_ffmpeg.sh 閲岀‖缂栫爜鐨?--disable-avformat
#   - 鍚敤 FFmpeg avformat demuxer (asf/aiff/ape 绛夊鍣ㄨВ鏋?
#   - 鏂板 ffmpeg_demux_jni.cc 鎻愪緵 10 涓?demux JNI 鍑芥暟
#   - CMakeLists.txt 閾炬帴 avformat 闈欐€佸簱 + 缂栬瘧 demux_jni.cc
#
# GitHub Actions 鍏嶈垂 Linux 鏈哄櫒锛?~4 鏍?CPU锛?GB 鍐呭瓨锛?4GB 纾佺洏
# 鍏ㄩ儴缂栬瘧娴佺▼绾?30~60 鍒嗛挓锛堜富瑕佽€楁椂鍦?FFmpeg configure + make锛?
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      MEDIA3_TAG: "1.5.1"
      ANDROID_NDK_VERSION: "r25b"
      ANDROID_NDK_ACTUAL_VERSION: "25.1.8937393"
      ANDROID_ABI_LEVEL: "21"
      # 鍚敤鐨?FFmpeg 闊抽瑙ｇ爜鍣?
      ENABLED_DECODERS: >-
        ape
        wmav1 wmav2 wmapro wmalossless
        pcm_s16be pcm_s16le pcm_u8 pcm_alaw pcm_mulaw pcm_f32be pcm_f32le
        mp3 mp3float flac vorbis opus alac aac aac_ltp ac3 eac3
      # 猸愶笍 鏂板: 鍚敤鐨?FFmpeg demuxer (瀹瑰櫒瑙ｅ鐢ㄥ櫒)
      #   asf = WMA 瀹瑰櫒
      #   aiff = AIFF/AIF 瀹瑰櫒
      #   ape = Monkey's Audio APE 瀹瑰櫒
      #   鍏朵粬 = 椤轰究鍔犱笂锛屼笉鍗犲灏戜綋绉?
      ENABLED_DEMUXERS: >-
        asf aiff ape wav mp3 flac ogg matroska mov mp4 avi
      # 猸愶笍 鏂板: 鍚敤鐨?parser (姣旂壒娴佽В鏋愬櫒)
      ENABLED_PARSERS: >-
        wmav1 wmav2 ape aac mp3 flac opus vorbis alac ac3 eac3
      # 猸愶笍 鏂板: 鍚敤鐨?protocol (IO 鍗忚)
      ENABLED_PROTOCOLS: >-
        file pipe
      # 猸愶笍 鏂板: 鍚敤鐨?bitstream filter
      ENABLED_BSF: >-
        aac_adtstoasc

    steps:

      # ===================== 0. 纾佺洏鐦﹁韩 =====================
      - name: "[纾佺洏] 鐦﹁韩锛氬垹闄ゆ棤鐢ㄩ瑁呰蒋浠讹紝鑵惧嚭鍙敤绌洪棿"
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d/dotnet* 2>/dev/null || true
          sudo rm -rf /opt/ghc /usr/local/share/boost /opt/mssql-tools /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/hostedtoolcache/Python /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean -y && sudo apt-get autoremove -y 2>/dev/null || true
          sudo rm -rf /tmp/* /tmp/.??* 2>/dev/null || true
          echo "=== Disk space after cleanup ==="
          df -h /

      # ===================== 1. 鐜鍑嗗 =====================
      - name: "[鍑嗗] 绯荤粺淇℃伅 + 瀹夎鍩虹鏋勫缓宸ュ叿"
        run: |
          echo "OS: $(uname -a)"
          echo "CPU cores: $(nproc)"
          free -h
          df -h /
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates git wget unzip \
            nasm pkg-config python3 python3-distutils
          echo "make: $(make --version | head -n1)"

      - name: "[鍑嗗] 瀹夎 JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ===================== 2. 涓嬭浇 Android NDK r25b =====================
      - name: "[NDK] 涓嬭浇骞惰В鍘?NDK r25b"
        run: |
          cd /tmp
          wget -q --show-progress \
            "https://dl.google.com/android/repository/android-ndk-${{ env.ANDROID_NDK_VERSION }}-linux.zip" \
            -O ndk.zip
          unzip -q ndk.zip -d /opt
          NDK_DIR="/opt/android-ndk-${{ env.ANDROID_NDK_VERSION }}"
          echo "NDK extracted to $NDK_DIR"
          ls -la "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -n 10
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      # ===================== 2b. 瀹夎 Android SDK =====================
      - name: "[Android SDK] 瀹夎 cmdline-tools + Platform 35 + Build-Tools 34.0.0 + CMake 3.22.1"
        timeout-minutes: 15
        run: |
          set -eu
          SDK_ROOT="/opt/android-sdk"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          cd /tmp
          wget -q --show-progress \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O sdk-cmdline.zip
          unzip -q sdk-cmdline.zip -d "${SDK_ROOT}/cmdline-tools"
          mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
          export PATH="${SDK_ROOT}/cmdline-tools/latest/bin:${SDK_ROOT}/platform-tools:${PATH}"
          yes | sdkmanager --sdk_root="${SDK_ROOT}" --licenses || true
          sdkmanager --sdk_root="${SDK_ROOT}" --install \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "platform-tools"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      # ===================== 3. 鍏嬮殕 Media3 婧愮爜 =====================
      - name: "[Media3] 鍏嬮殕 Media3 1.5.1 婧愮爜"
        run: |
          cd /tmp
          git clone --depth 1 --branch "${{ env.MEDIA3_TAG }}" \
            https://github.com/androidx/media.git media3
          cd media3
          echo "MEDIA3_CHECKOUT=$(pwd)" >> "$GITHUB_ENV"
          echo "HEAD: $(git log -1 --oneline)"
          ls -la libraries/decoder_ffmpeg/src/main/jni/

      # ===================== 4. 涓嬭浇 FFmpeg 6.0 婧愮爜骞堕摼鎺?=====================
      - name: "[FFmpeg] 涓嬭浇 FFmpeg 6.0 婧愮爜"
        run: |
          cd /tmp
          wget -q --show-progress "https://ffmpeg.org/releases/ffmpeg-6.0.tar.xz" -O ffmpeg-6.0.tar.xz
          echo "FFmpeg tar size: $(du -h ffmpeg-6.0.tar.xz | cut -f1)"
          tar xf ffmpeg-6.0.tar.xz
          test -f ffmpeg-6.0/configure && echo "OK: ffmpeg-6.0/configure exists" || echo "FAIL: extraction failed"

      - name: "[FFmpeg] 閾炬帴 FFmpeg 婧愮爜鍒?jni/ffmpeg 鐩綍"
        run: |
          FFMPEG_JNI_DIR="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main/jni"
          rm -rf "${FFMPEG_JNI_DIR}/ffmpeg" 2>/dev/null || true
          # 鍏堝皾璇?symlink锛屽け璐ュ啀瀹炰綋鎷疯礉
          if ln -sf /tmp/ffmpeg-6.0 "${FFMPEG_JNI_DIR}/ffmpeg" && test -f "${FFMPEG_JNI_DIR}/ffmpeg/configure"; then
            echo "INFO: symlink succeeded"
          else
            echo "WARN: symlink failed, falling back to copy"
            rm -rf "${FFMPEG_JNI_DIR}/ffmpeg"
            cp -r /tmp/ffmpeg-6.0 "${FFMPEG_JNI_DIR}/ffmpeg"
          fi
          test -d "${FFMPEG_JNI_DIR}/ffmpeg" && echo "OK: jni/ffmpeg dir exists" || echo "FAIL: jni/ffmpeg dir missing"
          ls -la "${FFMPEG_JNI_DIR}/ffmpeg/configure"

      # ===================== 5. 猸愶笍 鍏抽敭锛歅atch build_ffmpeg.sh 鍚敤 avformat =====================
      # Media3 瀹樻柟 build_ffmpeg.sh 纭紪鐮佷簡 --disable-avformat
      # 鎴戜滑闇€瑕?
      #   1) 鍒犳帀 --disable-avformat
      #   2) 鍔犱笂 demuxer/parser/protocol/bsf 鐨?--enable 閫夐」
      # 杩欐牱 make 鎵嶄細鐢熸垚 libavformat.a
      - name: "[Patch FFmpeg] 淇敼 build_ffmpeg.sh 鍚敤 avformat + demuxer"
        run: |
          FFMPEG_JNI_DIR="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main/jni"
          PATCHED_SH="${FFMPEG_JNI_DIR}/build_ffmpeg.sh"
          echo "==== COMMON_OPTIONS before patch ===="
          grep -A 25 "COMMON_OPTIONS=" "${PATCHED_SH}" | head -n 30

          # Step 1: 绉婚櫎 --disable-avformat锛堝叧閿紒娌℃湁杩欒灏变笉浼氱紪 libavformat锛?
          sed -i 's/--disable-avformat//g' "${PATCHED_SH}"
          echo "---- sed check ----"
          grep "avformat" "${PATCHED_SH}" || echo "OK: --disable-avformat removed"

          # Step 2: 鍦?COMMON_OPTIONS 鏈熬锛?-disable-vulkan 鍚庨潰锛夎拷鍔犳垜浠殑 enable 閫夐」
          # 鍥犱负 COMMON_OPTIONS 鏄弻寮曞彿澶氳瀛楃涓诧紝鎴戜滑鐢?sed 鍦?--enable-swresample 鍚庨潰鎻掑叆
          sed -i '/--enable-swresample$/a\    --enable-protocol=file \\\n    --enable-protocol=pipe \\' "${PATCHED_SH}"

          # 鐜板湪楠岃瘉淇敼
          echo "==== COMMON_OPTIONS after patch ===="
          grep -A 30 "COMMON_OPTIONS=" "${PATCHED_SH}" | head -n 40

          # 楠岃瘉 avformat 涓嶅啀琚鐢?
          grep -q "disable-avformat" "${PATCHED_SH}" && { echo "FAIL: ERROR: --disable-avformat still present"; exit 1; } \
            || echo "OK: --disable-avformat removed"

          # 楠岃瘉 enable-protocol 宸叉坊鍔?
          grep -q "enable-protocol=file" "${PATCHED_SH}" && echo "OK: --enable-protocol=file added" \
            || echo "WARN: enable-protocol may not have been added (non-fatal, will force-add later)"

      # ===================== 5b. 猸愶笍 寮哄埗杩藉姞 demuxer/parser/bsf 鍒?build_ffmpeg.sh =====================
      # 鍥犱负 build_ffmpeg.sh 鐨?COMMON_OPTIONS 涓嶆敮鎸?demuxer/parser 鍙傛暟
      # 鎴戜滑鍦ㄦ瘡娆?./configure 璋冪敤鏃舵墜鍔ㄨ拷鍔?--enable-demuxer=xxx 绛夊弬鏁?
      # 鍏蜂綋鍋氭硶锛氱洿鎺ヤ慨鏀硅剼鏈紝鍦ㄦ瘡涓?${COMMON_OPTIONS} 鍚庨潰杩藉姞鎴戜滑鐨?FLAGS
      - name: "[Patch FFmpeg] 杩藉姞 demuxer/parser/bsf/protocol 鍒?configure 鍛戒护"
        run: |
          FFMPEG_JNI_DIR="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main/jni"
          PATCHED_SH="${FFMPEG_JNI_DIR}/build_ffmpeg.sh"

          # 瀹氫箟 EXTRA_FLAGS 鍙橀噺锛堝崟琛岋紝閬垮厤 YAML heredoc 缂╄繘闂锛?
          EXTRA_FLAGS="--enable-avformat --enable-demuxer=asf --enable-demuxer=aiff --enable-demuxer=ape --enable-demuxer=wav --enable-demuxer=mp3 --enable-demuxer=flac --enable-demuxer=ogg --enable-demuxer=matroska --enable-demuxer=mov --enable-demuxer=mp4 --enable-demuxer=avi --enable-parser=wmav1 --enable-parser=wmav2 --enable-parser=ape --enable-parser=aac --enable-parser=mp3 --enable-parser=flac --enable-parser=opus --enable-parser=vorbis --enable-parser=alac --enable-parser=ac3 --enable-parser=eac3 --enable-protocol=file --enable-protocol=pipe --enable-bsf=aac_adtstoasc --enable-bsf=h264_mp4toannexb"

          # 鎶?EXTRA_FLAGS 鎻掑叆鍒?COMMON_OPTIONS 鐨?--enable-swresample 閭ｄ竴琛屽悗闈?
          # 鐢?sed 鍦?--enable-swresample 琛屽悗闈㈣拷鍔?EXTRA_FLAGS
          sed -i "/--enable-swresample/a\\    ${EXTRA_FLAGS}" "${PATCHED_SH}"

          echo "==== COMMON_OPTIONS after patch ===="
          grep -A 2 "enable-swresample" "${PATCHED_SH}" | head -n 5

          echo ""
          echo "==== Verify key patches ===="
          grep "disable-avformat" "${PATCHED_SH}" && echo "  OK: --disable-avformat removed" || echo "  FAIL: not found"
          grep "enable-avformat" "${PATCHED_SH}" && echo "  OK: --enable-avformat added" || echo "  FAIL: not found"
          grep "enable-demuxer=asf" "${PATCHED_SH}" && echo "  OK: --enable-demuxer=asf added" || echo "  FAIL: not found"

      # ===================== 5c. 猸愶笍 杩愯淇敼鍚庣殑 build_ffmpeg.sh 缂栬瘧 FFmpeg =====================
      - name: "[FFmpeg 缂栬瘧] 鏋勫缓鍏ㄩ儴 4 濂?ABI 鐨?FFmpeg 闈欐€佸簱 (鍚?libavformat.a)"
        timeout-minutes: 140
        run: |
          FFMPEG_MODULE_PATH="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main"
          BUILD_SH="${FFMPEG_MODULE_PATH}/jni/build_ffmpeg.sh"
          cd "${FFMPEG_MODULE_PATH}/jni"
          echo "===== Running patched build_ffmpeg.sh ====="
          bash "${BUILD_SH}" \
            "${FFMPEG_MODULE_PATH}" \
            "${{ env.ANDROID_NDK_ROOT }}" \
            "linux-x86_64" \
            "${{ env.ANDROID_ABI_LEVEL }}" \
            ${{ env.ENABLED_DECODERS }}

          echo ""
          echo "===== Verify build artifacts (each ABI must have libavformat.a!) ====="
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            echo "--- $abi ---"
            for lib in libavcodec.a libavformat.a libavutil.a libswresample.a; do
              f="ffmpeg/android-libs/$abi/$lib"
              if [ -f "$f" ]; then
                echo "  OK: $lib ($(du -h $f | cut -f1))"
              else
                echo "  FAIL: $lib missing!"
              fi
            done
            ls -la "ffmpeg/android-libs/$abi/" | head -n 10
          done

      # ===================== 5d. 猸愶笍 鍐?ffmpeg_demux_jni.cc (10 涓?demux JNI 鍑芥暟) =====================
      # 杩欐槸鎴戜滑鏂板鐨?JNI 鏂囦欢锛屾彁渚?avformat demux 鍔熻兘缁?Kotlin 鐨?FfmpegExtractor 璋冪敤
      - name: "[Write 1/2] ffmpeg_demux_jni.cc chunk1"
        run: |
          DEMUX_JNI="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main/jni/ffmpeg_demux_jni.cc"
          echo "" | base64 -d > "${DEMUX_JNI}"
      - name: "[Write 2/2] ffmpeg_demux_jni.cc chunk2 + verify"
        run: |
          DEMUX_JNI="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main/jni/ffmpeg_demux_jni.cc"
          echo "" | base64 -d >> "${DEMUX_JNI}"
          echo "==== ffmpeg_demux_jni.cc write complete ===="
          wc -l "${DEMUX_JNI}"
          head -5 "${DEMUX_JNI}"

      # ===================== 6. 猸愶笍 Patch CMakeLists.txt + 缂栬瘧 AAR =====================
      - name: "[Gradle] Patch CMakeLists.txt 鍔?avformat + demux_jni.cc + 缂栬瘧 AAR"
        timeout-minutes: 40
        run: |
          cd "${{ env.MEDIA3_CHECKOUT }}"
          chmod +x gradlew

          CMAKEFILE="libraries/decoder_ffmpeg/src/main/jni/CMakeLists.txt"
          FFMPEG_JNI_DIR="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main/jni"

          echo "===== Patch 0: original CMakeLists.txt ====="
          cat "${CMAKEFILE}"

          # 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲
          # Patch 1: foreach 寰幆閲屽姞涓?avformat
          #   鍘? foreach(ffmpeg_lib avutil swresample avcodec)
          #   鏀? foreach(ffmpeg_lib avformat avutil swresample avcodec)
          # 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲
          sed -i 's/foreach(ffmpeg_lib avutil swresample avcodec)/foreach(ffmpeg_lib avformat avutil swresample avcodec)/' "${CMAKEFILE}" || true
          grep "foreach.*avformat.*avutil" "${CMAKEFILE}" && echo "OK: Patch 1 applied" || { echo "FAIL: Patch 1 failed"; exit 1; }

          # 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲
          # Patch 2: add_library 閲屽姞涓?ffmpeg_demux_jni.cc
          #   鍘? add_library(ffmpegJNI SHARED ffmpeg_jni.cc)
          #   鏀? add_library(ffmpegJNI SHARED ffmpeg_jni.cc ffmpeg_demux_jni.cc)
          # 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲
          # (sed Patch 2 removed - the pattern never matched; Python script below handles this reliably)
          # 涓婇潰鐨?sed 鍙兘鍥犱负鏍煎紡闂娌℃纭尮閰嶏紝鐢ㄦ洿鍙潬鐨勬柟娉曪細
          # 鍏堟仮澶嶏紝鐒跺悗鐢?python 澶勭悊

          # 鐢?python 绮剧'澶勭悊 (base64 缂栫爜閬垮厤 YAML heredoc 缂╄繘闂)
          echo "" | base64 -d | python3

          echo ""
          echo "===== Patched CMakeLists.txt ====="
          cat "${CMAKEFILE}"
          echo ""
          echo "===== Verify key patches ====="
          grep "avformat avutil" "${CMAKEFILE}" && echo "OK: avformat added to foreach" || echo "FAIL: avformat foreach patch failed"
          grep "ffmpeg_demux_jni.cc" "${CMAKEFILE}" && echo "OK: ffmpeg_demux_jni.cc added to add_library" || echo "FAIL: demux_jni.cc patch failed"
          grep "PRIVATE avformat" "${CMAKEFILE}" && echo "OK: avformat added to target_link_libraries" || echo "FAIL: avformat link patch failed"

          # 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲
          # 寮烘牎楠? libavformat.a 蹇呴』瀛樺湪浜庢瘡涓?ABI 鐩綍
          # 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲
          echo ""
          echo "===== Sanity-check libavformat.a ====="
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            LIBAV="${FFMPEG_JNI_DIR}/ffmpeg/android-libs/$abi/libavformat.a"
            if test -f "$LIBAV"; then
              echo "OK: $abi: libavformat.a exists ($(du -h $LIBAV | cut -f1))"
            else
              echo "FAIL: $abi: libavformat.a missing! cannot link"
              ls -la "${FFMPEG_JNI_DIR}/ffmpeg/android-libs/$abi/" 2>&1
              # 鎵撳嵃 FFmpeg configure 鏄惁鍚敤浜?avformat
              echo "--- Check FFmpeg build config ---"
              cat "${FFMPEG_JNI_DIR}/ffmpeg/android-libs/$abi/config.log" 2>/dev/null | grep -i avformat | head -n 5 || echo "(no config.log)"
              exit 2
            fi
          done

          # 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲
          # 鍐?local.properties + Gradle 缂栬瘧
          # 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲
          SDK_ROOT="${{ env.ANDROID_HOME }}"
          NDK_DIR="${{ env.ANDROID_NDK_ROOT }}"
          CMAKE_DIR="${SDK_ROOT}/cmake/3.22.1"
          printf 'sdk.dir=%s\nndk.dir=%s\ncmake.dir=%s\n' \
            "$SDK_ROOT" "$NDK_DIR" "$CMAKE_DIR" > local.properties
          cat -A local.properties

          export GRADLE_OPTS="-Xmx4g -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="${CMAKE_DIR}/bin:${NDK_DIR}:${SDK_ROOT}/cmdline-tools/latest/bin:${SDK_ROOT}/build-tools/34.0.0:${SDK_ROOT}/platform-tools:${PATH}"

          TARGET_PROJECT=":lib-decoder-ffmpeg"
          echo "Target module: $TARGET_PROJECT"

          echo "===== dry-run verify ====="
          ./gradlew "${TARGET_PROJECT}:assembleRelease" --dry-run --no-daemon 2>&1 | tail -n 10

          echo "===== Building assembleRelease ====="
          ./gradlew "${TARGET_PROJECT}:assembleRelease" \
            --no-daemon --stacktrace --no-build-cache --no-configuration-cache \
            -PdisablePreDex -Pandroid.builder.sdkDownload=false

          # 鎵?AAR
          EXPECTED_AAR="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/build/outputs/aar/lib-decoder-ffmpeg-release.aar"
          if [ -f "$EXPECTED_AAR" ]; then
            AAR="$EXPECTED_AAR"
          else
            AAR=$(find "${{ env.MEDIA3_CHECKOUT }}" -name "*.aar" -path "*release*" -print 2>/dev/null | head -n1)
          fi
          echo ""
          echo "===== AAR found ====="
          echo "AAR=$AAR"
          ls -lh "$AAR"

          # 楠岃瘉 AAR 鍐呭
          echo ""
          echo "===== AAR internal structure ====="
          unzip -l "${AAR}" | head -n 40

          # 鍏抽敭楠岃瘉锛?so 鏄惁鍖呭惈 avformat 绗﹀彿
          echo ""
          echo "===== Sanity-check: .so must link avformat symbols ====="
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          unzip -q "${AAR}" "jni/*/libffmpegJNI.so" 2>/dev/null
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            SO="jni/$abi/libffmpegJNI.so"
            if [ -f "$SO" ]; then
              echo "--- $abi ---"
              echo "  size: $(ls -lh $SO | cut -f5)"
              # 鐢?ndk 鐨?llvm-nm 妫€鏌?avformat 绗﹀彿
              NM="${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
              if [ -f "$NM" ]; then
                AVFMT_SYMS=$("$NM" "$SO" 2>/dev/null | grep -c "avformat_" || true)
                echo "  avformat_ symbols: $AVFMT_SYMS"
                if [ "$AVFMT_SYMS" -gt 0 ]; then
                  echo "  OK: avformat linked"
                else
                  echo "  FAIL: avformat not linked"
                fi
                # 妫€鏌ユ垜浠殑 demux JNI 鍑芥暟
                DEMUX_SYMS=$("$NM" "$SO" 2>/dev/null | grep -c "Java_com_wmplay_extractor_FfmpegExtractor" || true)
                echo "  demux JNI symbols: $DEMUX_SYMS"
                if [ "$DEMUX_SYMS" -gt 0 ]; then
                  echo "  OK: demux JNI functions exported"
                else
                  echo "  FAIL: demux JNI functions not exported"
                fi
              fi
            else
              echo "FAIL: $abi/libffmpegJNI.so missing"
            fi
          done
          cd /
          rm -rf "$TMPDIR"

          echo "FINAL_AAR_PATH=$AAR" >> "$GITHUB_ENV"

      # ===================== 7. 涓婁紶 AAR 鍒?Artifacts =====================
      - name: "[涓婁紶] 涓婁紶 AAR 鍒?Actions Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "decoder_ffmpeg_with_demux-media3-1.5.1"
          path: |
            ${{ env.FINAL_AAR_PATH }}
          retention-days: 90
          if-no-files-found: error

      # ===================== 8. 鍙戝竷鍒?Release =====================
      - name: "[鍙戝竷] 涓婁紶 AAR 鍒?GitHub Release"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "media3-1.5.1-ffmpeg-demux-v1"
          name: "Media3 1.5.1 FFmpeg Extension WITH Container Demuxer (WMA+APE+AIFF)"
          body: |
