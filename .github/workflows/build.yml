name: Build Media3 FFmpeg Extension AAR (WMA/APE/AIFF + Container Demuxer)

# 触发方式：
# 1. 上传文件到 main 分支后自动开始
# 2. 也可以在 Actions 页面手动点击 Run workflow
#
# ⭐️ 本次构建相比 v10 新增：
#   - 移除 build_ffmpeg.sh 里硬编码的 --disable-avformat
#   - 启用 FFmpeg avformat demuxer (asf/aiff/ape 等容器解析)
#   - 新增 ffmpeg_demux_jni.cc 提供 10 个 demux JNI 函数
#   - CMakeLists.txt 链接 avformat 静态库 + 编译 demux_jni.cc
#
# GitHub Actions 免费 Linux 机器：2~4 核 CPU，7GB 内存，14GB 磁盘
# 全部编译流程约 30~60 分钟（主要耗时在 FFmpeg configure + make）
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      MEDIA3_TAG: "1.5.1"
      ANDROID_NDK_VERSION: "r25b"
      ANDROID_NDK_ACTUAL_VERSION: "25.1.8937393"
      ANDROID_ABI_LEVEL: "21"
      # 启用的 FFmpeg 音频解码器
      ENABLED_DECODERS: >-
        ape
        wmav1 wmav2 wmapro wmalossless
        pcm_s16be pcm_s16le pcm_u8 pcm_alaw pcm_mulaw pcm_f32be pcm_f32le
        mp3 mp3float flac vorbis opus alac aac aac_ltp ac3 eac3
      # ⭐️ 新增: 启用的 FFmpeg demuxer (容器解复用器)
      #   asf = WMA 容器
      #   aiff = AIFF/AIF 容器
      #   ape = Monkey's Audio APE 容器
      #   其他 = 顺便加上，不占多少体积
      ENABLED_DEMUXERS: >-
        asf aiff ape wav mp3 flac ogg matroska mov mp4 avi
      # ⭐️ 新增: 启用的 parser (比特流解析器)
      ENABLED_PARSERS: >-
        wmav1 wmav2 ape aac mp3 flac opus vorbis alac ac3 eac3
      # ⭐️ 新增: 启用的 protocol (IO 协议)
      ENABLED_PROTOCOLS: >-
        file pipe
      # ⭐️ 新增: 启用的 bitstream filter
      ENABLED_BSF: >-
        aac_adtstoasc

    steps:

      # ===================== 0. 磁盘瘦身 =====================
      - name: "[磁盘] 瘦身：删除无用预装软件，腾出可用空间"
        run: |
          echo "--- 瘦身前磁盘 ---"
          df -h /
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d/dotnet* 2>/dev/null || true
          sudo rm -rf /opt/ghc /usr/local/share/boost /opt/mssql-tools /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/hostedtoolcache/Python /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean -y && sudo apt-get autoremove -y 2>/dev/null || true
          sudo rm -rf /tmp/* /tmp/.??* 2>/dev/null || true
          echo "--- 瘦身后磁盘 ---"
          df -h /

      # ===================== 1. 环境准备 =====================
      - name: "[准备] 系统信息 + 安装基础构建工具"
        run: |
          echo "OS: $(uname -a)"
          echo "CPU cores: $(nproc)"
          free -h
          df -h /
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates git wget unzip \
            nasm pkg-config python3 python3-distutils
          echo "make: $(make --version | head -n1)"

      - name: "[准备] 安装 JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ===================== 2. 下载 Android NDK r25b =====================
      - name: "[NDK] 下载并解压 NDK r25b"
        run: |
          cd /tmp
          wget -q --show-progress \
            "https://dl.google.com/android/repository/android-ndk-${{ env.ANDROID_NDK_VERSION }}-linux.zip" \
            -O ndk.zip
          unzip -q ndk.zip -d /opt
          NDK_DIR="/opt/android-ndk-${{ env.ANDROID_NDK_VERSION }}"
          echo "NDK 解压到: $NDK_DIR"
          ls -la "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -n 10
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      # ===================== 2b. 安装 Android SDK =====================
      - name: "[Android SDK] 安装 cmdline-tools + Platform 35 + Build-Tools 34.0.0 + CMake 3.22.1"
        timeout-minutes: 15
        run: |
          set -eu
          SDK_ROOT="/opt/android-sdk"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          cd /tmp
          wget -q --show-progress \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O sdk-cmdline.zip
          unzip -q sdk-cmdline.zip -d "${SDK_ROOT}/cmdline-tools"
          mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
          export PATH="${SDK_ROOT}/cmdline-tools/latest/bin:${SDK_ROOT}/platform-tools:${PATH}"
          yes | sdkmanager --sdk_root="${SDK_ROOT}" --licenses || true
          sdkmanager --sdk_root="${SDK_ROOT}" --install \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "platform-tools"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      # ===================== 3. 克隆 Media3 源码 =====================
      - name: "[Media3] 克隆 Media3 1.5.1 源码"
        run: |
          cd /tmp
          git clone --depth 1 --branch "${{ env.MEDIA3_TAG }}" \
            https://github.com/androidx/media.git media3
          cd media3
          echo "MEDIA3_CHECKOUT=$(pwd)" >> "$GITHUB_ENV"
          echo "HEAD: $(git log -1 --oneline)"
          ls -la libraries/decoder_ffmpeg/src/main/jni/

      # ===================== 4. 下载 FFmpeg 6.0 源码并链接 =====================
      - name: "[FFmpeg] 下载 FFmpeg 6.0 源码"
        run: |
          cd /tmp
          wget -q --show-progress "https://ffmpeg.org/releases/ffmpeg-6.0.tar.xz" -O ffmpeg-6.0.tar.xz
          echo "FFmpeg tar size: $(du -h ffmpeg-6.0.tar.xz | cut -f1)"
          tar xf ffmpeg-6.0.tar.xz
          test -f ffmpeg-6.0/configure && echo "✅ ffmpeg-6.0/configure 存在" || echo "❌ 解压失败"

      - name: "[FFmpeg] 链接 FFmpeg 源码到 jni/ffmpeg 目录"
        run: |
          FFMPEG_JNI_DIR="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main/jni"
          rm -rf "${FFMPEG_JNI_DIR}/ffmpeg" 2>/dev/null || true
          # 先尝试 symlink，失败再实体拷贝
          if ln -sf /tmp/ffmpeg-6.0 "${FFMPEG_JNI_DIR}/ffmpeg" && test -f "${FFMPEG_JNI_DIR}/ffmpeg/configure"; then
            echo "INFO: symlink 成功"
          else
            echo "WARN: symlink 失败，改用实体拷贝"
            rm -rf "${FFMPEG_JNI_DIR}/ffmpeg"
            cp -r /tmp/ffmpeg-6.0 "${FFMPEG_JNI_DIR}/ffmpeg"
          fi
          test -d "${FFMPEG_JNI_DIR}/ffmpeg" && echo "✅ jni/ffmpeg 目录存在" || echo "❌ jni/ffmpeg 目录不存在"
          ls -la "${FFMPEG_JNI_DIR}/ffmpeg/configure"

      # ===================== 5. ⭐️ 关键：Patch build_ffmpeg.sh 启用 avformat =====================
      # Media3 官方 build_ffmpeg.sh 硬编码了 --disable-avformat
      # 我们需要:
      #   1) 删掉 --disable-avformat
      #   2) 加上 demuxer/parser/protocol/bsf 的 --enable 选项
      # 这样 make 才会生成 libavformat.a
      - name: "[Patch FFmpeg] 修改 build_ffmpeg.sh 启用 avformat + demuxer"
        run: |
          FFMPEG_JNI_DIR="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main/jni"
          PATCHED_SH="${FFMPEG_JNI_DIR}/build_ffmpeg.sh"
          echo "==== Patch 前的 COMMON_OPTIONS 部分 ===="
          grep -A 25 "COMMON_OPTIONS=" "${PATCHED_SH}" | head -n 30

          # Step 1: 移除 --disable-avformat（关键！没有这行就不会编 libavformat）
          sed -i 's/--disable-avformat//g' "${PATCHED_SH}"
          echo "---- sed 后检查 ----"
          grep "avformat" "${PATCHED_SH}" || echo "✅ --disable-avformat 已删除"

          # Step 2: 在 COMMON_OPTIONS 末尾（--disable-vulkan 后面）追加我们的 enable 选项
          # 因为 COMMON_OPTIONS 是双引号多行字符串，我们用 sed 在 --enable-swresample 后面插入
          sed -i '/--enable-swresample$/a\    --enable-protocol=file \\\n    --enable-protocol=pipe \\' "${PATCHED_SH}"

          # 现在验证修改
          echo "==== Patch 后的 COMMON_OPTIONS 部分 ===="
          grep -A 30 "COMMON_OPTIONS=" "${PATCHED_SH}" | head -n 40

          # 验证 avformat 不再被禁用
          grep -q "disable-avformat" "${PATCHED_SH}" && { echo "❌ ERROR: --disable-avformat 仍存在!"; exit 1; } \
            || echo "✅ --disable-avformat 已移除"

          # 验证 enable-protocol 已添加
          grep -q "enable-protocol=file" "${PATCHED_SH}" && echo "✅ --enable-protocol=file 已添加" \
            || echo "⚠️ enable-protocol 可能没加成功（非致命，后面我们会在 ENABLED_FLAGS 里强制加）"

      # ===================== 5b. ⭐️ 强制追加 demuxer/parser/bsf 到 build_ffmpeg.sh =====================
      # 因为 build_ffmpeg.sh 的 COMMON_OPTIONS 不支持 demuxer/parser 参数
      # 我们在每次 ./configure 调用时手动追加 --enable-demuxer=xxx 等参数
      # 具体做法：直接修改脚本，在每个 ${COMMON_OPTIONS} 后面追加我们的 FLAGS
      - name: "[Patch FFmpeg] 追加 demuxer/parser/bsf/protocol 到 configure 命令"
        run: |
          FFMPEG_JNI_DIR="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main/jni"
          PATCHED_SH="${FFMPEG_JNI_DIR}/build_ffmpeg.sh"

          # 定义要追加的 FLAGS 字符串（所有 demuxer/parser/protocol/bsf）
          # 注意：sed 替换时要转义斜杠
          EXTRA_FLAGS="--enable-demuxer=asf --enable-demuxer=aiff --enable-demuxer=ape --enable-demuxer=wav --enable-demuxer=mp3 --enable-demuxer=flac --enable-demuxer=ogg --enable-demuxer=matroska --enable-demuxer=mov --enable-demuxer=mp4 --enable-demuxer=avi --enable-parser=wmav1 --enable-parser=wmav2 --enable-parser=ape --enable-parser=aac --enable-parser=mp3 --enable-parser=flac --enable-parser=opus --enable-parser=vorbis --enable-parser=alac --enable-parser=ac3 --enable-parser=eac3 --enable-protocol=file --enable-protocol=pipe --enable-bsf=aac_adtstoasc"

          # 把 ${COMMON_OPTIONS} 后面的每一行（除了 make -j）都加上 EXTRA_FLAGS
          # 更简单的方法：在脚本开头定义 EXTRA_FFMPEG_FLAGS 变量，然后在每次 configure 调用时追加上
          # 我们在 COMMON_OPTIONS 定义块之后追加：
          cat >> "${PATCHED_SH}" << 'PATCH_EOF'

# ════════════════════════════════════════════════════════════════════
# PATCH: 添加 avformat demuxer/parser/protocol/bsf 支持
# 这些是 Media3 官方 build_ffmpeg.sh 默认没启用的
# ════════════════════════════════════════════════════════════════════
EXTRA_FFMPEG_FLAGS="
    --enable-avformat
    --enable-demuxer=asf
    --enable-demuxer=aiff
    --enable-demuxer=ape
    --enable-demuxer=wav
    --enable-demuxer=mp3
    --enable-demuxer=flac
    --enable-demuxer=ogg
    --enable-demuxer=matroska
    --enable-demuxer=mov
    --enable-demuxer=mp4
    --enable-demuxer=avi
    --enable-parser=wmav1
    --enable-parser=wmav2
    --enable-parser=ape
    --enable-parser=aac
    --enable-parser=mp3
    --enable-parser=flac
    --enable-parser=opus
    --enable-parser=vorbis
    --enable-parser=alac
    --enable-parser=ac3
    --enable-parser=eac3
    --enable-protocol=file
    --enable-protocol=pipe
    --enable-bsf=aac_adtstoasc
    --enable-bsf=h264_mp4toannexb
"
# 在每个 ${COMMON_OPTIONS} 后面追加 ${EXTRA_FFMPEG_FLAGS}
# 用 sed 把 COMMON_OPTIONS 的引用改成 COMMON_OPTIONS EXTRA_FFMPEG_FLAGS
PATCH_EOF

          # 现在把脚本里每一处 `${COMMON_OPTIONS}` 后面加上 `${EXTRA_FFMPEG_FLAGS}`
          sed -i 's/\${COMMON_OPTIONS}/${COMMON_OPTIONS} ${EXTRA_FFMPEG_FLAGS}/g' "${PATCHED_SH}"

          echo "==== sed 替换后检查 configure 命令 ===="
          grep -B1 -A 3 "\${COMMON_OPTIONS}" "${PATCHED_SH}" | head -n 30

          echo ""
          echo "==== 验证最终脚本关键部分 ===="
          echo "-- disable-avformat 是否还存在:"
          grep "disable-avformat" "${PATCHED_SH}" || echo "  ✅ 已移除"
          echo "-- enable-demuxer=asf 是否存在:"
          grep "enable-demuxer=asf" "${PATCHED_SH}" && echo "  ✅ 已添加" || echo "  ❌ 未找到"

      # ===================== 5c. ⭐️ 运行修改后的 build_ffmpeg.sh 编译 FFmpeg =====================
      - name: "[FFmpeg 编译] 构建全部 4 套 ABI 的 FFmpeg 静态库 (含 libavformat.a)"
        timeout-minutes: 140
        run: |
          FFMPEG_MODULE_PATH="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main"
          BUILD_SH="${FFMPEG_MODULE_PATH}/jni/build_ffmpeg.sh"
          cd "${FFMPEG_MODULE_PATH}/jni"
          echo "===== 运行修改后的 build_ffmpeg.sh ====="
          bash "${BUILD_SH}" \
            "${FFMPEG_MODULE_PATH}" \
            "${{ env.ANDROID_NDK_ROOT }}" \
            "linux-x86_64" \
            "${{ env.ANDROID_ABI_LEVEL }}" \
            ${{ env.ENABLED_DECODERS }}

          echo ""
          echo "===== 验证编译产物 (每个 ABI 必须有 libavformat.a!) ====="
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            echo "--- $abi ---"
            for lib in libavcodec.a libavformat.a libavutil.a libswresample.a; do
              f="ffmpeg/android-libs/$abi/$lib"
              if [ -f "$f" ]; then
                echo "  ✅ $lib ($(du -h $f | cut -f1))"
              else
                echo "  ❌ $lib 缺失!"
              fi
            done
            ls -la "ffmpeg/android-libs/$abi/" | head -n 10
          done

      # ===================== 5d. ⭐️ 写 ffmpeg_demux_jni.cc (10 个 demux JNI 函数) =====================
      # 这是我们新增的 JNI 文件，提供 avformat demux 功能给 Kotlin 的 FfmpegExtractor 调用
      - name: "[Write] 生成 ffmpeg_demux_jni.cc (avformat demux JNI)"
        run: |
          DEMUX_JNI="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main/jni/ffmpeg_demux_jni.cc"
          cat > "${DEMUX_JNI}" << 'DEMUX_EOF'
/*
 * FfmpegExtractor demux JNI bridge
 *
 * 为 Kotlin 类 com.wmplay.extractor.FfmpegExtractor 提供 native 函数。
 * 基于 FFmpeg avformat API 实现容器解复用 (container demuxing)。
 *
 * 函数命名格式: Java_com_wmplay_extractor_FfmpegExtractor_<name>
 * (JNI 规范: 包名转下划线 + 类名 + 方法名)
 */
#include <android/log.h>
#include <jni.h>
#include <stdlib.h>
#include <string.h>

extern "C" {
#define __STDC_CONSTANT_MACROS
#ifdef _STDINT_H
#undef _STDINT_H
#endif
#include <stdint.h>
#include <libavformat/avformat.h>
#include <libavcodec/avcodec.h>
#include <libavutil/error.h>
#include <libavutil/opt.h>
}

#define LOG_TAG "ffmpeg_demux"
#define LOGE(...) ((void)__android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__))
#define LOGD(...) ((void)__android_log_print(ANDROID_LOG_DEBUG, LOG_TAG, __VA_ARGS__))
#define LOGW(...) ((void)__android_log_print(ANDROID_LOG_WARN, LOG_TAG, __VA_ARGS__))

// ═══════════════════════════════════════════════════════════════════
// 内部状态结构体：封装一次 demux session 的所有状态
// Kotlin 端用 jlong 持有这个指针
// ═══════════════════════════════════════════════════════════════════
struct DemuxSession {
    AVFormatContext *fmtCtx;
    int audioStreamIndex;
    const AVCodecParameters *audioCodecParams;
    AVPacket *currentPacket;     // 当前正在读的 packet
    int64_t lastPtsUs;           // 上一个 packet 的 PTS (微秒)
    bool hasPacket;              // currentPacket 是否有数据
};

// 格式化 FFmpeg 错误码
static void log_av_error(const char *func, int err) {
    char buf[256];
    av_strerror(err, buf, sizeof(buf));
    LOGE("%s: %s (code=%d)", func, buf, err);
}

// 根据 FFmpeg codec_id 映射到 Android Media3 MIME type
static const char* codec_to_mime(AVCodecID codecId) {
    switch (codecId) {
        case AV_CODEC_ID_WMAV1: return "audio/x-ms-wma";
        case AV_CODEC_ID_WMAV2: return "audio/x-ms-wma";
        case AV_CODEC_ID_WMAPRO: return "audio/x-ms-wma";
        case AV_CODEC_ID_WMALOSSLESS: return "audio/x-ms-wma";
        case AV_CODEC_ID_APE: return "audio/ape";
        case AV_CODEC_ID_FLAC: return "audio/flac";
        case AV_CODEC_ID_MP3: return "audio/mpeg";
        case AV_CODEC_ID_AAC: return "audio/mp4a-latm";
        case AV_CODEC_ID_OPUS: return "audio/opus";
        case AV_CODEC_ID_VORBIS: return "audio/vorbis";
        case AV_CODEC_ID_ALAC: return "audio/alac";
        case AV_CODEC_ID_AC3: return "audio/ac3";
        case AV_CODEC_ID_EAC3: return "audio/eac3";
        case AV_CODEC_ID_PCM_S16LE: return "audio/l16";
        case AV_CODEC_ID_PCM_S16BE: return "audio/l16";
        case AV_CODEC_ID_PCM_U8: return "audio/l16";
        case AV_CODEC_ID_PCM_ALAW: return "audio/g711a";
        case AV_CODEC_ID_PCM_MULAW: return "audio/g711u";
        case AV_CODEC_ID_PCM_F32LE: return "audio/l16";
        case AV_CODEC_ID_PCM_F32BE: return "audio/l16";
        default:
            LOGE("Unknown codec id: %d", codecId);
            return "audio/x-ffmpeg";  // fallback
    }
}

// 时间基转微秒
static int64_t pts_to_us(int64_t pts, AVRational timeBase) {
    if (pts == AV_NOPTS_VALUE) return AV_NOPTS_VALUE;
    return av_rescale_q(pts, timeBase, (AVRational){1, 1000000});
}

// ═══════════════════════════════════════════════════════════════════
// 1. nativeProbeData - 探测 16 字节 header 判断 FFmpeg 能识别的格式
// 返回 true 表示 FFmpeg 能处理这个文件
// ═══════════════════════════════════════════════════════════════════
extern "C" JNIEXPORT jboolean JNICALL
Java_com_wmplay_extractor_FfmpegExtractor_nativeProbeData(
    JNIEnv *env, jobject /*thiz*/, jbyteArray headerBytes) {

    if (!headerBytes) return JNI_FALSE;
    jsize len = env->GetArrayLength(headerBytes);
    if (len < 4) return JNI_FALSE;

    uint8_t *buf = (uint8_t *)env->GetByteArrayElements(headerBytes, NULL);
    if (!buf) return JNI_FALSE;

    AVProbeData pd;
    memset(&pd, 0, sizeof(pd));
    pd.buf = buf;
    pd.buf_size = len;
    pd.filename = "";

    const AVInputFormat *fmt = av_probe_input_format(&pd, 0);

    env->ReleaseByteArrayElements(headerBytes, (jbyte*)buf, JNI_ABORT);

    if (fmt) {
        LOGD("probe OK: format=%s (name=%s)", fmt->long_name ? fmt->long_name : "?", fmt->name);
        return JNI_TRUE;
    }
    return JNI_FALSE;
}

// ═══════════════════════════════════════════════════════════════════
// 2. nativeOpenInput - 打开本地文件，返回 DemuxSession* 作为 jlong
// ═══════════════════════════════════════════════════════════════════
extern "C" JNIEXPORT jlong JNICALL
Java_com_wmplay_extractor_FfmpegExtractor_nativeOpenInput(
    JNIEnv *env, jobject /*thiz*/, jstring pathStr) {

    if (!pathStr) return 0;
    const char *path = env->GetStringUTFChars(pathStr, NULL);
    if (!path) return 0;

    LOGD("nativeOpenInput: %s", path);

    DemuxSession *session = new DemuxSession();
    memset(session, 0, sizeof(*session));

    // 必须先调用 avformat_network_init（虽然我们只用本地文件，但某些协议会用到）
    // 其实本地文件不需要，跳过

    // 用 avformat_open_input 打开
    int ret = avformat_open_input(&session->fmtCtx, path, NULL, NULL);
    if (ret < 0) {
        log_av_error("avformat_open_input", ret);
        delete session;
        env->ReleaseStringUTFChars(pathStr, path);
        return 0;
    }

    // 找到音频流
    ret = avformat_find_stream_info(session->fmtCtx, NULL);
    if (ret < 0) {
        log_av_error("avformat_find_stream_info", ret);
        avformat_close_input(&session->fmtCtx);
        delete session;
        env->ReleaseStringUTFChars(pathStr, path);
        return 0;
    }

    // 遍历找第一个音频流
    session->audioStreamIndex = -1;
    for (unsigned i = 0; i < session->fmtCtx->nb_streams; i++) {
        AVMediaType type = session->fmtCtx->streams[i]->codecpar->codec_type;
        if (type == AVMEDIA_TYPE_AUDIO) {
            session->audioStreamIndex = (int)i;
            break;
        }
    }

    if (session->audioStreamIndex >= 0) {
        session->audioCodecParams = session->fmtCtx->streams[session->audioStreamIndex]->codecpar;
        LOGD("audio stream=%d, codec_id=%d, codec_name=%s",
             session->audioStreamIndex,
             session->audioCodecParams->codec_id,
             avcodec_get_name(session->audioCodecParams->codec_id));
    }

    session->currentPacket = av_packet_alloc();
    session->lastPtsUs = 0;
    session->hasPacket = false;

    env->ReleaseStringUTFChars(pathStr, path);

    LOGD("nativeOpenInput SUCCESS: ctx=%p, audioStream=%d", session->fmtCtx, session->audioStreamIndex);
    return (jlong)session;
}

// ═══════════════════════════════════════════════════════════════════
// 3. nativeGetAudioTrackIndex - 返回音频流索引 (负数=没有音频)
// ═══════════════════════════════════════════════════════════════════
extern "C" JNIEXPORT jint JNICALL
Java_com_wmplay_extractor_FfmpegExtractor_nativeGetAudioTrackIndex(
    JNIEnv *env, jobject /*thiz*/, jlong ctxPtr) {

    DemuxSession *session = (DemuxSession *)ctxPtr;
    if (!session || !session->fmtCtx) return -1;
    return session->audioStreamIndex;
}

// ═══════════════════════════════════════════════════════════════════
// 4. nativeGetCodecMimeType - 返回音频 codec 对应的 Android MIME type
// ═══════════════════════════════════════════════════════════════════
extern "C" JNIEXPORT jstring JNICALL
Java_com_wmplay_extractor_FfmpegExtractor_nativeGetCodecMimeType(
    JNIEnv *env, jobject /*thiz*/, jlong ctxPtr, jint streamIndex) {

    DemuxSession *session = (DemuxSession *)ctxPtr;
    if (!session || !session->fmtCtx) return env->NewStringUTF("");
    if (streamIndex < 0 || streamIndex >= (jint)session->fmtCtx->nb_streams) return env->NewStringUTF("");

    AVCodecParameters *params = session->fmtCtx->streams[streamIndex]->codecpar;
    const char *mime = codec_to_mime(params->codec_id);
    return env->NewStringUTF(mime);
}

// ═══════════════════════════════════════════════════════════════════
// 5. nativeGetSampleRate - 返回采样率
// ═══════════════════════════════════════════════════════════════════
extern "C" JNIEXPORT jint JNICALL
Java_com_wmplay_extractor_FfmpegExtractor_nativeGetSampleRate(
    JNIEnv *env, jobject /*thiz*/, jlong ctxPtr, jint streamIndex) {

    DemuxSession *session = (DemuxSession *)ctxPtr;
    if (!session || !session->fmtCtx) return 44100;
    if (streamIndex < 0 || streamIndex >= (jint)session->fmtCtx->nb_streams) return 44100;

    AVCodecParameters *params = session->fmtCtx->streams[streamIndex]->codecpar;
    return params->sample_rate > 0 ? params->sample_rate : 44100;
}

// ═══════════════════════════════════════════════════════════════════
// 6. nativeGetChannelCount - 返回声道数
// ═══════════════════════════════════════════════════════════════════
extern "C" JNIEXPORT jint JNICALL
Java_com_wmplay_extractor_FfmpegExtractor_nativeGetChannelCount(
    JNIEnv *env, jobject /*thiz*/, jlong ctxPtr, jint streamIndex) {

    DemuxSession *session = (DemuxSession *)ctxPtr;
    if (!session || !session->fmtCtx) return 2;
    if (streamIndex < 0 || streamIndex >= (jint)session->fmtCtx->nb_streams) return 2;

    AVCodecParameters *params = session->fmtCtx->streams[streamIndex]->codecpar;
    int ch = params->ch_layout.nb_channels;
    return ch > 0 ? ch : (params->channel_layout ? 2 : 2);
}

// ═══════════════════════════════════════════════════════════════════
// 7. nativeReadPacket - 读取下一帧音频数据包
// 返回值: >0 = 字节数, 0 = EOF, <0 = 错误
// 数据写入传入的 Java byte array
// ═══════════════════════════════════════════════════════════════════
extern "C" JNIEXPORT jint JNICALL
Java_com_wmplay_extractor_FfmpegExtractor_nativeReadPacket(
    JNIEnv *env, jobject /*thiz*/, jlong ctxPtr, jbyteArray buffer) {

    DemuxSession *session = (DemuxSession *)ctxPtr;
    if (!session || !session->fmtCtx) return -1;
    if (!buffer) return -1;

    // 如果上一个 packet 还有未读的数据，先处理掉（但我们每次读完整 packet，所以不存在）
    // 释放上一个 packet
    if (session->currentPacket && session->hasPacket) {
        av_packet_unref(session->currentPacket);
        session->hasPacket = false;
    }

    // 循环读直到找到音频流的 packet
    int ret;
    while ((ret = av_read_frame(session->fmtCtx, session->currentPacket)) >= 0) {
        if (session->currentPacket->stream_index == session->audioStreamIndex) {
            // 找到了音频 packet
            session->hasPacket = true;
            break;
        }
        // 不是音频流，跳过
        av_packet_unref(session->currentPacket);
    }

    if (ret < 0) {
        // EOF 或错误
        if (ret == AVERROR_EOF) {
            LOGD("nativeReadPacket: EOF reached");
        } else {
            LOGW("nativeReadPacket error: %d", ret);
        }
        return 0;  // 0 表示 EOF
    }

    // 把 packet 数据拷到 Java buffer
    jsize bufLen = env->GetArrayLength(buffer);
    int packetSize = session->currentPacket->size;
    int copySize = (packetSize < (int)bufLen) ? packetSize : (int)bufLen;

    env->SetByteArrayRegion(buffer, 0, copySize, (jbyte *)session->currentPacket->data);

    // 记录 PTS (转成微秒)
    if (session->currentPacket->pts != AV_NOPTS_VALUE && session->audioStreamIndex >= 0) {
        AVStream *stream = session->fmtCtx->streams[session->audioStreamIndex];
        session->lastPtsUs = pts_to_us(session->currentPacket->pts, stream->time_base);
    } else {
        session->lastPtsUs = 0;
    }

    return copySize;
}

// ═══════════════════════════════════════════════════════════════════
// 8. nativeGetPacketPtsUs - 获取上一个 packet 的 PTS (微秒)
// ═══════════════════════════════════════════════════════════════════
extern "C" JNIEXPORT jlong JNICALL
Java_com_wmplay_extractor_FfmpegExtractor_nativeGetPacketPtsUs(
    JNIEnv *env, jobject /*thiz*/, jlong ctxPtr) {

    DemuxSession *session = (DemuxSession *)ctxPtr;
    if (!session) return 0;
    return session->lastPtsUs;
}

// ═══════════════════════════════════════════════════════════════════
// 9. nativeSeek - 跳转到指定时间 (微秒)
// 返回 0=成功, 非零=失败
// ═══════════════════════════════════════════════════════════════════
extern "C" JNIEXPORT jint JNICALL
Java_com_wmplay_extractor_FfmpegExtractor_nativeSeek(
    JNIEnv *env, jobject /*thiz*/, jlong ctxPtr, jlong timeUs) {

    DemuxSession *session = (DemuxSession *)ctxPtr;
    if (!session || !session->fmtCtx) return -1;
    if (session->audioStreamIndex < 0) return -1;

    // 释放当前 packet
    if (session->currentPacket && session->hasPacket) {
        av_packet_unref(session->currentPacket);
        session->hasPacket = false;
    }

    // 微秒转流时间基
    AVStream *stream = session->fmtCtx->streams[session->audioStreamIndex];
    int64_t ts = av_rescale_q(timeUs, (AVRational){1, 1000000}, stream->time_base);

    LOGD("nativeSeek: timeUs=%lld -> ts=%lld (timebase=%d/%d)",
         (long long)timeUs, (long long)ts, stream->time_base.num, stream->time_base.den);

    int ret = av_seek_frame(session->fmtCtx, session->audioStreamIndex, ts, AVSEEK_FLAG_BACKWARD);
    if (ret < 0) {
        // 降级：用 avformat_seek_file 或在整个时间轴上 seek
        AVRational fmt_tb = session->fmtCtx->iformat->flags & AVFMT_NOBINSEARCH
            ? session->fmtCtx->streams[0]->time_base
            : (AVRational){1, AV_TIME_BASE};
        int64_t ts2 = av_rescale_q(timeUs, (AVRational){1, 1000000}, fmt_tb);
        ret = av_seek_frame(session->fmtCtx, -1, ts2, AVSEEK_FLAG_BACKWARD);
        if (ret < 0) {
            log_av_error("av_seek_frame", ret);
            return ret;
        }
    }

    // 刷新解码器
    avformat_flush(session->fmtCtx);
    session->lastPtsUs = timeUs;
    return 0;
}

// ═══════════════════════════════════════════════════════════════════
// 10. nativeCloseInput - 关闭并释放所有资源
// ═══════════════════════════════════════════════════════════════════
extern "C" JNIEXPORT void JNICALL
Java_com_wmplay_extractor_FfmpegExtractor_nativeCloseInput(
    JNIEnv *env, jobject /*thiz*/, jlong ctxPtr) {

    DemuxSession *session = (DemuxSession *)ctxPtr;
    if (!session) return;

    LOGD("nativeCloseInput: closing ctx=%p", session->fmtCtx);

    if (session->currentPacket) {
        av_packet_free(&session->currentPacket);
        session->currentPacket = nullptr;
    }
    if (session->fmtCtx) {
        avformat_close_input(&session->fmtCtx);
        session->fmtCtx = nullptr;
    }

    delete session;
    LOGD("nativeCloseInput done");
}
