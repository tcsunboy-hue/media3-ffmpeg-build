name: Build Media3 FFmpeg Extension AAR (WMA/APE/AIFF + Container Demuxer)

# 触发方式：
# 1. 上传文件到 main 分支后自动开始
# 2. 也可以在 Actions 页面手动点击 Run workflow
#
# ⭐️ 本次构建相比 v10 新增：
#   - 移除 build_ffmpeg.sh 里硬编码的 --disable-avformat
#   - 启用 FFmpeg avformat demuxer (asf/aiff/ape 等容器解析)
#   - 新增 ffmpeg_demux_jni.cc 提供 10 个 demux JNI 函数
#   - CMakeLists.txt 链接 avformat 静态库 + 编译 demux_jni.cc
#
# GitHub Actions 免费 Linux 机器：2~4 核 CPU，7GB 内存，14GB 磁盘
# 全部编译流程约 30~60 分钟（主要耗时在 FFmpeg configure + make）
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      MEDIA3_TAG: "1.5.1"
      ANDROID_NDK_VERSION: "r25b"
      ANDROID_NDK_ACTUAL_VERSION: "25.1.8937393"
      ANDROID_ABI_LEVEL: "21"
      # 启用的 FFmpeg 音频解码器
      ENABLED_DECODERS: >-
        ape
        wmav1 wmav2 wmapro wmalossless
        pcm_s16be pcm_s16le pcm_u8 pcm_alaw pcm_mulaw pcm_f32be pcm_f32le
        mp3 mp3float flac vorbis opus alac aac aac_ltp ac3 eac3
      # ⭐️ 新增: 启用的 FFmpeg demuxer (容器解复用器)
      #   asf = WMA 容器
      #   aiff = AIFF/AIF 容器
      #   ape = Monkey's Audio APE 容器
      #   其他 = 顺便加上，不占多少体积
      ENABLED_DEMUXERS: >-
        asf aiff ape wav mp3 flac ogg matroska mov mp4 avi
      # ⭐️ 新增: 启用的 parser (比特流解析器)
      ENABLED_PARSERS: >-
        wmav1 wmav2 ape aac mp3 flac opus vorbis alac ac3 eac3
      # ⭐️ 新增: 启用的 protocol (IO 协议)
      ENABLED_PROTOCOLS: >-
        file pipe
      # ⭐️ 新增: 启用的 bitstream filter
      ENABLED_BSF: >-
        aac_adtstoasc

    steps:

      # ===================== 0. 磁盘瘦身 =====================
      - name: "[磁盘] 瘦身：删除无用预装软件，腾出可用空间"
        run: |
          echo "--- 瘦身前磁盘 ---"
          df -h /
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d/dotnet* 2>/dev/null || true
          sudo rm -rf /opt/ghc /usr/local/share/boost /opt/mssql-tools /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/hostedtoolcache/Python /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean -y && sudo apt-get autoremove -y 2>/dev/null || true
          sudo rm -rf /tmp/* /tmp/.??* 2>/dev/null || true
          echo "--- 瘦身后磁盘 ---"
          df -h /

      # ===================== 1. 环境准备 =====================
      - name: "[准备] 系统信息 + 安装基础构建工具"
        run: |
          echo "OS: $(uname -a)"
          echo "CPU cores: $(nproc)"
          free -h
          df -h /
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates git wget unzip \
            nasm pkg-config python3 python3-distutils
          echo "make: $(make --version | head -n1)"

      - name: "[准备] 安装 JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ===================== 2. 下载 Android NDK r25b =====================
      - name: "[NDK] 下载并解压 NDK r25b"
        run: |
          cd /tmp
          wget -q --show-progress \
            "https://dl.google.com/android/repository/android-ndk-${{ env.ANDROID_NDK_VERSION }}-linux.zip" \
            -O ndk.zip
          unzip -q ndk.zip -d /opt
          NDK_DIR="/opt/android-ndk-${{ env.ANDROID_NDK_VERSION }}"
          echo "NDK 解压到: $NDK_DIR"
          ls -la "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -n 10
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      # ===================== 2b. 安装 Android SDK =====================
      - name: "[Android SDK] 安装 cmdline-tools + Platform 35 + Build-Tools 34.0.0 + CMake 3.22.1"
        timeout-minutes: 15
        run: |
          set -eu
          SDK_ROOT="/opt/android-sdk"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          cd /tmp
          wget -q --show-progress \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O sdk-cmdline.zip
          unzip -q sdk-cmdline.zip -d "${SDK_ROOT}/cmdline-tools"
          mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
          export PATH="${SDK_ROOT}/cmdline-tools/latest/bin:${SDK_ROOT}/platform-tools:${PATH}"
          yes | sdkmanager --sdk_root="${SDK_ROOT}" --licenses || true
          sdkmanager --sdk_root="${SDK_ROOT}" --install \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "platform-tools"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      # ===================== 3. 克隆 Media3 源码 =====================
      - name: "[Media3] 克隆 Media3 1.5.1 源码"
        run: |
          cd /tmp
          git clone --depth 1 --branch "${{ env.MEDIA3_TAG }}" \
            https://github.com/androidx/media.git media3
          cd media3
          echo "MEDIA3_CHECKOUT=$(pwd)" >> "$GITHUB_ENV"
          echo "HEAD: $(git log -1 --oneline)"
          ls -la libraries/decoder_ffmpeg/src/main/jni/

      # ===================== 4. 下载 FFmpeg 6.0 源码并链接 =====================
      - name: "[FFmpeg] 下载 FFmpeg 6.0 源码"
        run: |
          cd /tmp
          wget -q --show-progress "https://ffmpeg.org/releases/ffmpeg-6.0.tar.xz" -O ffmpeg-6.0.tar.xz
          echo "FFmpeg tar size: $(du -h ffmpeg-6.0.tar.xz | cut -f1)"
          tar xf ffmpeg-6.0.tar.xz
          test -f ffmpeg-6.0/configure && echo "✅ ffmpeg-6.0/configure 存在" || echo "❌ 解压失败"

      - name: "[FFmpeg] 链接 FFmpeg 源码到 jni/ffmpeg 目录"
        run: |
          FFMPEG_JNI_DIR="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main/jni"
          rm -rf "${FFMPEG_JNI_DIR}/ffmpeg" 2>/dev/null || true
          # 先尝试 symlink，失败再实体拷贝
          if ln -sf /tmp/ffmpeg-6.0 "${FFMPEG_JNI_DIR}/ffmpeg" && test -f "${FFMPEG_JNI_DIR}/ffmpeg/configure"; then
            echo "INFO: symlink 成功"
          else
            echo "WARN: symlink 失败，改用实体拷贝"
            rm -rf "${FFMPEG_JNI_DIR}/ffmpeg"
            cp -r /tmp/ffmpeg-6.0 "${FFMPEG_JNI_DIR}/ffmpeg"
          fi
          test -d "${FFMPEG_JNI_DIR}/ffmpeg" && echo "✅ jni/ffmpeg 目录存在" || echo "❌ jni/ffmpeg 目录不存在"
          ls -la "${FFMPEG_JNI_DIR}/ffmpeg/configure"

      # ===================== 5. ⭐️ 关键：Patch build_ffmpeg.sh 启用 avformat =====================
      # Media3 官方 build_ffmpeg.sh 硬编码了 --disable-avformat
      # 我们需要:
      #   1) 删掉 --disable-avformat
      #   2) 加上 demuxer/parser/protocol/bsf 的 --enable 选项
      # 这样 make 才会生成 libavformat.a
      - name: "[Patch FFmpeg] 修改 build_ffmpeg.sh 启用 avformat + demuxer"
        run: |
          FFMPEG_JNI_DIR="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main/jni"
          PATCHED_SH="${FFMPEG_JNI_DIR}/build_ffmpeg.sh"
          echo "==== Patch 前的 COMMON_OPTIONS 部分 ===="
          grep -A 25 "COMMON_OPTIONS=" "${PATCHED_SH}" | head -n 30

          # Step 1: 移除 --disable-avformat（关键！没有这行就不会编 libavformat）
          sed -i 's/--disable-avformat//g' "${PATCHED_SH}"
          echo "---- sed 后检查 ----"
          grep "avformat" "${PATCHED_SH}" || echo "✅ --disable-avformat 已删除"

          # Step 2: 在 COMMON_OPTIONS 末尾（--disable-vulkan 后面）追加我们的 enable 选项
          # 因为 COMMON_OPTIONS 是双引号多行字符串，我们用 sed 在 --enable-swresample 后面插入
          sed -i '/--enable-swresample$/a\    --enable-protocol=file \\\n    --enable-protocol=pipe \\' "${PATCHED_SH}"

          # 现在验证修改
          echo "==== Patch 后的 COMMON_OPTIONS 部分 ===="
          grep -A 30 "COMMON_OPTIONS=" "${PATCHED_SH}" | head -n 40

          # 验证 avformat 不再被禁用
          grep -q "disable-avformat" "${PATCHED_SH}" && { echo "❌ ERROR: --disable-avformat 仍存在!"; exit 1; } \
            || echo "✅ --disable-avformat 已移除"

          # 验证 enable-protocol 已添加
          grep -q "enable-protocol=file" "${PATCHED_SH}" && echo "✅ --enable-protocol=file 已添加" \
            || echo "⚠️ enable-protocol 可能没加成功（非致命，后面我们会在 ENABLED_FLAGS 里强制加）"

      # ===================== 5b. ⭐️ 强制追加 demuxer/parser/bsf 到 build_ffmpeg.sh =====================
      # 因为 build_ffmpeg.sh 的 COMMON_OPTIONS 不支持 demuxer/parser 参数
      # 我们在每次 ./configure 调用时手动追加 --enable-demuxer=xxx 等参数
      # 具体做法：直接修改脚本，在每个 ${COMMON_OPTIONS} 后面追加我们的 FLAGS
      - name: "[Patch FFmpeg] 追加 demuxer/parser/bsf/protocol 到 configure 命令"
        run: |
          FFMPEG_JNI_DIR="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main/jni"
          PATCHED_SH="${FFMPEG_JNI_DIR}/build_ffmpeg.sh"

          # 定义 EXTRA_FLAGS 变量（单行，避免 YAML heredoc 缩进问题）
          EXTRA_FLAGS="--enable-avformat --enable-demuxer=asf --enable-demuxer=aiff --enable-demuxer=ape --enable-demuxer=wav --enable-demuxer=mp3 --enable-demuxer=flac --enable-demuxer=ogg --enable-demuxer=matroska --enable-demuxer=mov --enable-demuxer=mp4 --enable-demuxer=avi --enable-parser=wmav1 --enable-parser=wmav2 --enable-parser=ape --enable-parser=aac --enable-parser=mp3 --enable-parser=flac --enable-parser=opus --enable-parser=vorbis --enable-parser=alac --enable-parser=ac3 --enable-parser=eac3 --enable-protocol=file --enable-protocol=pipe --enable-bsf=aac_adtstoasc --enable-bsf=h264_mp4toannexb"

          # 把 EXTRA_FLAGS 插入到 COMMON_OPTIONS 的 --enable-swresample 那一行后面
          # 用 sed 在 --enable-swresample 行后面追加 EXTRA_FLAGS
          sed -i "/--enable-swresample/a\\    ${EXTRA_FLAGS}" "${PATCHED_SH}"

          echo "==== Patch 后的 COMMON_OPTIONS 部分 ===="
          grep -A 2 "enable-swresample" "${PATCHED_SH}" | head -n 5

          echo ""
          echo "==== 验证关键 patch ===="
          grep "disable-avformat" "${PATCHED_SH}" && echo "  ❌ --disable-avformat 仍存在!" || echo "  ✅ --disable-avformat 已移除"
          grep "enable-avformat" "${PATCHED_SH}" && echo "  ✅ --enable-avformat 已添加" || echo "  ❌ 未找到"
          grep "enable-demuxer=asf" "${PATCHED_SH}" && echo "  ✅ --enable-demuxer=asf 已添加" || echo "  ❌ 未找到"

      # ===================== 5c. ⭐️ 运行修改后的 build_ffmpeg.sh 编译 FFmpeg =====================
      - name: "[FFmpeg 编译] 构建全部 4 套 ABI 的 FFmpeg 静态库 (含 libavformat.a)"
        timeout-minutes: 140
        run: |
          FFMPEG_MODULE_PATH="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main"
          BUILD_SH="${FFMPEG_MODULE_PATH}/jni/build_ffmpeg.sh"
          cd "${FFMPEG_MODULE_PATH}/jni"
          echo "===== 运行修改后的 build_ffmpeg.sh ====="
          bash "${BUILD_SH}" \
            "${FFMPEG_MODULE_PATH}" \
            "${{ env.ANDROID_NDK_ROOT }}" \
            "linux-x86_64" \
            "${{ env.ANDROID_ABI_LEVEL }}" \
            ${{ env.ENABLED_DECODERS }}

          echo ""
          echo "===== 验证编译产物 (每个 ABI 必须有 libavformat.a!) ====="
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            echo "--- $abi ---"
            for lib in libavcodec.a libavformat.a libavutil.a libswresample.a; do
              f="ffmpeg/android-libs/$abi/$lib"
              if [ -f "$f" ]; then
                echo "  ✅ $lib ($(du -h $f | cut -f1))"
              else
                echo "  ❌ $lib 缺失!"
              fi
            done
            ls -la "ffmpeg/android-libs/$abi/" | head -n 10
          done

      # ===================== 5d. ⭐️ 写 ffmpeg_demux_jni.cc (10 个 demux JNI 函数) =====================
      # 这是我们新增的 JNI 文件，提供 avformat demux 功能给 Kotlin 的 FfmpegExtractor 调用
      - name: "[Write] 生成 ffmpeg_demux_jni.cc (avformat demux JNI)"
        run: |
          DEMUX_JNI="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main/jni/ffmpeg_demux_jni.cc"
          echo "" | base64 -d > "${DEMUX_JNI}"
          echo "==== ffmpeg_demux_jni.cc 写入完成 ===="
          wc -l "${DEMUX_JNI}"
          head -5 "${DEMUX_JNI}"

      # ===================== 6. ⭐️ Patch CMakeLists.txt + 编译 AAR =====================
      - name: "[Gradle] Patch CMakeLists.txt 加 avformat + demux_jni.cc + 编译 AAR"
        timeout-minutes: 40
        run: |
          cd "${{ env.MEDIA3_CHECKOUT }}"
          chmod +x gradlew

          CMAKEFILE="libraries/decoder_ffmpeg/src/main/jni/CMakeLists.txt"
          FFMPEG_JNI_DIR="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/src/main/jni"

          echo "===== Patch 0: 原 CMakeLists.txt ====="
          cat "${CMAKEFILE}"

          # ══════════════════════════════════════════════════════════
          # Patch 1: foreach 循环里加上 avformat
          #   原: foreach(ffmpeg_lib avutil swresample avcodec)
          #   改: foreach(ffmpeg_lib avformat avutil swresample avcodec)
          # ══════════════════════════════════════════════════════════
          sed -i 's/foreach(ffmpeg_lib avutil swresample avcodec)/foreach(ffmpeg_lib avformat avutil swresample avcodec)/' "${CMAKEFILE}"
          grep "foreach.*avformat.*avutil" "${CMAKEFILE}" && echo "✅ Patch 1 生效" || { echo "❌ Patch 1 失败"; exit 1; }

          # ══════════════════════════════════════════════════════════
          # Patch 2: add_library 里加上 ffmpeg_demux_jni.cc
          #   原: add_library(ffmpegJNI SHARED ffmpeg_jni.cc)
          #   改: add_library(ffmpegJNI SHARED ffmpeg_jni.cc ffmpeg_demux_jni.cc)
          # ══════════════════════════════════════════════════════════
          sed -i 's/add_library(ffmpegJNI$/\n            SHARED\n            ffmpeg_jni.cc\n            ffmpeg_demux_jni.cc\n)/' "${CMAKEFILE}"
          # 上面的 sed 可能因为格式问题没正确匹配，用更可靠的方法：
          # 先恢复，然后用 python 处理
          sed -i 's/ffmpegJNI.*ffmpeg_jni.cc.*ffmpeg_demux_jni.cc.*)/add_library(ffmpegJNI/' "${CMAKEFILE}" 2>/dev/null || true

          # 用 python 精确处理 (base64 编码避免 YAML heredoc 缩进问题)
          echo "" | base64 -d | python3

          echo ""
          echo "===== Patch 后 CMakeLists.txt ====="
          cat "${CMAKEFILE}"
          echo ""
          echo "===== 验证关键 patch ====="
          grep "avformat avutil" "${CMAKEFILE}" && echo "✅ avformat 加入 foreach" || echo "❌ avformat foreach patch 失败"
          grep "ffmpeg_demux_jni.cc" "${CMAKEFILE}" && echo "✅ ffmpeg_demux_jni.cc 加入 add_library" || echo "❌ demux_jni.cc patch 失败"
          grep "PRIVATE avformat" "${CMAKEFILE}" && echo "✅ avformat 加入 target_link_libraries" || echo "❌ avformat link patch 失败"

          # ══════════════════════════════════════════════════════════
          # 强校验: libavformat.a 必须存在于每个 ABI 目录
          # ══════════════════════════════════════════════════════════
          echo ""
          echo "===== 强校验: libavformat.a ====="
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            LIBAV="${FFMPEG_JNI_DIR}/ffmpeg/android-libs/$abi/libavformat.a"
            if test -f "$LIBAV"; then
              echo "✅ $abi: libavformat.a 存在 ($(du -h $LIBAV | cut -f1))"
            else
              echo "❌ $abi: libavformat.a 缺失! 无法链接"
              ls -la "${FFMPEG_JNI_DIR}/ffmpeg/android-libs/$abi/" 2>&1
              # 打印 FFmpeg configure 是否启用了 avformat
              echo "--- 检查 FFmpeg 编译配置 ---"
              cat "${FFMPEG_JNI_DIR}/ffmpeg/android-libs/$abi/config.log" 2>/dev/null | grep -i avformat | head -n 5 || echo "(无 config.log)"
              exit 2
            fi
          done

          # ══════════════════════════════════════════════════════════
          # 写 local.properties + Gradle 编译
          # ══════════════════════════════════════════════════════════
          SDK_ROOT="${{ env.ANDROID_HOME }}"
          NDK_DIR="${{ env.ANDROID_NDK_ROOT }}"
          CMAKE_DIR="${SDK_ROOT}/cmake/3.22.1"
          printf 'sdk.dir=%s\nndk.dir=%s\ncmake.dir=%s\n' \
            "$SDK_ROOT" "$NDK_DIR" "$CMAKE_DIR" > local.properties
          cat -A local.properties

          export GRADLE_OPTS="-Xmx4g -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="${CMAKE_DIR}/bin:${NDK_DIR}:${SDK_ROOT}/cmdline-tools/latest/bin:${SDK_ROOT}/build-tools/34.0.0:${SDK_ROOT}/platform-tools:${PATH}"

          TARGET_PROJECT=":lib-decoder-ffmpeg"
          echo "目标模块: $TARGET_PROJECT"

          echo "===== dry-run 验证 ====="
          ./gradlew "${TARGET_PROJECT}:assembleRelease" --dry-run --no-daemon 2>&1 | tail -n 10

          echo "===== 正式编译 assembleRelease ====="
          ./gradlew "${TARGET_PROJECT}:assembleRelease" \
            --no-daemon --stacktrace --no-build-cache --no-configuration-cache \
            -PdisablePreDex -Pandroid.builder.sdkDownload=false

          # 找 AAR
          EXPECTED_AAR="${{ env.MEDIA3_CHECKOUT }}/libraries/decoder_ffmpeg/build/outputs/aar/lib-decoder-ffmpeg-release.aar"
          if [ -f "$EXPECTED_AAR" ]; then
            AAR="$EXPECTED_AAR"
          else
            AAR=$(find "${{ env.MEDIA3_CHECKOUT }}" -name "*.aar" -path "*release*" -print 2>/dev/null | head -n1)
          fi
          echo ""
          echo "===== AAR 找到 ====="
          echo "AAR=$AAR"
          ls -lh "$AAR"

          # 验证 AAR 内容
          echo ""
          echo "===== AAR 内部结构 ====="
          unzip -l "${AAR}" | head -n 40

          # 关键验证：.so 是否包含 avformat 符号
          echo ""
          echo "===== 强校验: .so 必须链接 avformat 符号 ====="
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          unzip -q "${AAR}" "jni/*/libffmpegJNI.so" 2>/dev/null
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            SO="jni/$abi/libffmpegJNI.so"
            if [ -f "$SO" ]; then
              echo "--- $abi ---"
              echo "  大小: $(ls -lh $SO | cut -f5)"
              # 用 ndk 的 llvm-nm 检查 avformat 符号
              NM="${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
              if [ -f "$NM" ]; then
                AVFMT_SYMS=$("$NM" "$SO" 2>/dev/null | grep -c "avformat_" || true)
                echo "  avformat_ 符号数: $AVFMT_SYMS"
                if [ "$AVFMT_SYMS" -gt 0 ]; then
                  echo "  ✅ avformat 已链接!"
                else
                  echo "  ❌ avformat 未链接!"
                fi
                # 检查我们的 demux JNI 函数
                DEMUX_SYMS=$("$NM" "$SO" 2>/dev/null | grep -c "Java_com_wmplay_extractor_FfmpegExtractor" || true)
                echo "  demux JNI 符号数: $DEMUX_SYMS"
                if [ "$DEMUX_SYMS" -gt 0 ]; then
                  echo "  ✅ demux JNI 函数已导出!"
                else
                  echo "  ❌ demux JNI 函数未导出!"
                fi
              fi
            else
              echo "❌ $abi/libffmpegJNI.so 不存在!"
            fi
          done
          cd /
          rm -rf "$TMPDIR"

          echo "FINAL_AAR_PATH=$AAR" >> "$GITHUB_ENV"

      # ===================== 7. 上传 AAR 到 Artifacts =====================
      - name: "[上传] 上传 AAR 到 Actions Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "decoder_ffmpeg_with_demux-media3-1.5.1"
          path: |
            ${{ env.FINAL_AAR_PATH }}
          retention-days: 90
          if-no-files-found: error

      # ===================== 8. 发布到 Release =====================
      - name: "[发布] 上传 AAR 到 GitHub Release"
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "media3-1.5.1-ffmpeg-demux-v1"
          name: "Media3 1.5.1 FFmpeg Extension WITH Container Demuxer (WMA+APE+AIFF)"
          body: |
            🎉 **v1 with avformat demuxer** - 首次包含容器解复用功能的构建!

            相比旧版的关键变化:
            - ✅ **移除了 `--disable-avformat`**: FFmpeg 现在会编译 libavformat.a
            - ✅ **启用了 demuxer**: asf (WMA), aiff (AIFF), ape (Monkey's Audio), wav, mp3, flac, ogg, mkv, mov, mp4, avi
            - ✅ **启用了 parser**: wmav1/wmav2/ape/aac/mp3/flac/opus/vorbis/alac/ac3/eac3
            - ✅ **启用了 protocol**: file, pipe
            - ✅ **新增 ffmpeg_demux_jni.cc**: 10 个 avformat demux JNI 函数

            Kotlin 侧需要搭配:
            - `FfmpegExtractor.kt` (我们写的 Extractor 实现)
            - `ExtendedExtractorsFactory.kt` (包装 DefaultExtractorsFactory)
            - `PlaybackService.kt` 里加 `.setExtractorsFactory(ExtendedExtractorsFactory())`

            编译配置:
            - Media3 版本：1.5.1
            - Android NDK ：r25b
            - ANDROID_ABI：21
            - 包含 ABI：armeabi-v7a, arm64-v8a, x86, x86_64
            - FFmpeg 版本：6.0
            - 解码器：WMA(wmav1/wmav2/wmapro/wmalossless), APE, AIFF PCM, mp3, flac, vorbis, opus, alac, aac, ac3, eac3

            使用方法：
            1. 下载 decoder_ffmpeg-release.aar
            2. 复制到 Android 项目的 app/libs/ 目录（替换旧版）
            3. build.gradle.kts 添加:
               ```kotlin
               dependencies {
                   implementation(files("libs/decoder_ffmpeg-release.aar"))
               }
               ```
            4. 确保 Kotlin Extractor 层已就位
          files: |
            ${{ env.FINAL_AAR_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
